[package]
name = "revideo"
version = "3.3.0"
description = "ReVideo - schlanker Video-Player & Trimmer"
edition = "2021"

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "canvas", "tokio", "advanced", "wgpu"] }
iced_video_player = "0.6"
gstreamer = "0.23"
gstreamer-app = "0.23"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros"] }
url = "2"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Local copy with redraw/upload fixes, see vendor/iced_video_player/PATCHES.md.
[patch.crates-io]
iced_video_player = { path = "vendor/iced_video_player" }
