id: de.retrydev.ReVideo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: revideo
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Navigation through the folder of the open video, export next to the source.
  - --filesystem=host

modules:
  # libx264 for the Discord preset; the runtime's ffmpeg ships without it.
  - name: x264
    config-opts:
      - --enable-static
      - --enable-pic
      - --disable-cli
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  # AV1 decoding for ffmpeg; ffmpeg has no software AV1 decoder of its own.
  - name: dav1d
    buildsystem: meson
    config-opts:
      - -Ddefault_library=static
      - -Denable_tools=false
      - -Denable_tests=false
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://downloads.videolan.org/pub/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz
        sha256: 686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5

  # Static ffmpeg/ffprobe CLI only: shared libs in /app/lib would shadow the
  # runtime's libav* that gst-libav is built against.
  - name: ffmpeg
    config-opts:
      - --disable-shared
      - --enable-static
      - --enable-gpl
      - --enable-libx264
      - --enable-libdav1d
      - --pkg-config-flags=--static
      - --disable-doc
      - --disable-ffplay
      - --disable-debug
    cleanup:
      - /include
      - /lib
      - /share
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  - name: revideo
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/revideo/cargo
      # Local builds only: crates are fetched during the build.
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/revideo /app/bin/revideo
      - install -Dm644 packaging/linux/de.retrydev.ReVideo.desktop /app/share/applications/de.retrydev.ReVideo.desktop
      - install -Dm644 packaging/linux/de.retrydev.ReVideo.metainfo.xml /app/share/metainfo/de.retrydev.ReVideo.metainfo.xml
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/512x512/apps/de.retrydev.ReVideo.png
      - install -Dm644 assets/icon-128.png /app/share/icons/hicolor/128x128/apps/de.retrydev.ReVideo.png
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build
          - dist
          - .git
