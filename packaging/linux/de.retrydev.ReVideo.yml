id: de.retrydev.ReVideo
# Qt 6 and the ffmpeg libraries (full codecs via codecs-extra) come from the runtime.
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: revideo
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  # Update check against the GitHub releases API.
  - --share=network
  # In-app updates: installs the downloaded bundle via `flatpak-spawn --host flatpak`.
  - --talk-name=org.freedesktop.Flatpak
  # Navigation through the folder of the open video, export next to the source.
  - --filesystem=host

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.a'

modules:
  # Playback. mpv, libplacebo and libass are LGPL/ISC; mpv is built without its GPL parts.
  - name: libass
    buildsystem: meson
    config-opts:
      - -Dtest=disabled
      - -Dprofile=disabled
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
        sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      # Git for the submodules (glad, jinja, fast_float).
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dvulkan=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  # Export ffmpeg (GPL because of x264) as a standalone program; the app only runs
  # it as a process. Built after mpv so its static libs never end up in libmpv.
  # libx264 for the Discord preset; the runtime's ffmpeg ships without it.
  - name: x264
    config-opts:
      - --enable-static
      - --enable-pic
      - --disable-cli
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  # AV1 decoding for the export ffmpeg; ffmpeg has no software AV1 decoder of its own.
  - name: dav1d
    buildsystem: meson
    config-opts:
      - -Ddefault_library=static
      - -Denable_tools=false
      - -Denable_tests=false
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://downloads.videolan.org/pub/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz
        sha256: 686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5

  # Static CLI only: shared libs in /app/lib would shadow the runtime's libav* that
  # libmpv is linked against.
  - name: ffmpeg
    config-opts:
      - --disable-shared
      - --enable-static
      - --enable-gpl
      - --enable-libx264
      - --enable-libdav1d
      - --pkg-config-flags=--static
      - --disable-doc
      - --disable-ffplay
      - --disable-ffprobe
      - --disable-debug
    cleanup:
      - /include
      - /lib
      - /share
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  - name: revideo
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - dist
          - .git
          - .flatpak-builder
