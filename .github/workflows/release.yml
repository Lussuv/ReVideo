# Baut Flatpak und Windows-Installer und veröffentlicht beides im öffentlichen Repo
# Lussuv/ReVideo-releases, wo die App nach Updates fragt. Auslöser: Push auf main mit
# neuer Major- oder Minor-Version in CMakeLists.txt (3.4.0, 4.0.0); Patch-Versionen
# (3.4.1) und schon veröffentlichte Versionen werden übersprungen.
# Jedes Release enthält außerdem den Quellcode der mitgelieferten Fremdkomponenten
# (LGPL/GPL), getrennt für Linux und Windows.
# Secret RELEASES_TOKEN: Fine-grained Token, nur ReVideo-releases, "Contents: Read and write".
name: Release

on:
  push:
    branches: [main]
    paths: [CMakeLists.txt]
  # Manuell, z. B. wenn ein Release-Lauf gescheitert ist (Actions → Release → Run workflow).
  workflow_dispatch:

# Zwei schnelle Pushes sollen nicht beide dieselbe Version bauen.
concurrency: release

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^project(ReVideo VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${version##*.}" != 0 ]; then
            echo "$version ist eine Patch-Version, kein Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif curl -sf -o /dev/null "https://api.github.com/repos/Lussuv/ReVideo-releases/releases/tags/v$version"; then
            echo "v$version ist schon veröffentlicht."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  flatpak:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/linux/de.retrydev.ReVideo.yml
          bundle: ReVideo-${{ needs.version.outputs.version }}-x86_64.flatpak
          # Fremdmodule (mpv, ffmpeg, …) nur neu bauen, wenn sich das Manifest ändert.
          cache-key: flatpak-builder-${{ hashFiles('packaging/linux/de.retrydev.ReVideo.yml') }}
          upload-artifact: false
      # Die Downloads von flatpak-builder sind genau die Quellen der Fremdmodule.
      - run: >-
          tar -cf "ReVideo-$VERSION-linux-sources.tar" packaging/linux/de.retrydev.ReVideo.yml
          -C .flatpak-builder downloads git
      # Artefakte reichen nur bis zum publish-Job; länger aufbewahrt füllen sie das Speicherkontingent.
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          retention-days: 1
          path: |
            ReVideo-${{ needs.version.outputs.version }}-x86_64.flatpak
            ReVideo-${{ needs.version.outputs.version }}-linux-sources.tar

  # MSYS2 UCRT64 auf einem Windows-Runner; ffmpeg und mpv werden dort als LGPL gebaut,
  # siehe scripts/build-windows-deps.sh und scripts/build-windows.sh.
  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make diffutils tar zstd
          pacboy: >-
            toolchain:p cmake:p ninja:p meson:p nasm:p pkgconf:p python:p
            qt6-base:p qt6-declarative:p libass:p libplacebo:p dav1d:p x264:p
            ffnvcodec-headers:p nsis:p
      # ffmpeg und mpv (~45 min) nur neu bauen, wenn sich das Skript oder ein MSYS2-Paket
      # ändert; gespeichert wird auch dann, wenn der Rest des Builds danach scheitert.
      - id: pkgs
        run: echo "hash=$(pacman -Q | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: deps
        uses: actions/cache/restore@v6
        with:
          path: |
            build/windows/src
            build/windows/lgpl
            build/windows/export
          key: windows-deps-${{ hashFiles('scripts/build-windows-deps.sh') }}-${{ steps.pkgs.outputs.hash }}
      - run: scripts/build-windows-deps.sh
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/windows/src
            build/windows/lgpl
            build/windows/export
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - run: scripts/build-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          retention-days: 1
          path: dist/*

  publish:
    needs: [version, flatpak, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Release in ReVideo-releases anlegen
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo Lussuv/ReVideo-releases \
            --title "ReVideo $VERSION" \
            --notes "ReVideo $VERSION

          Quellcode dieser Version: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA

          Die *-sources.tar enthalten den Quellcode der mitgelieferten Open-Source-Komponenten (ffmpeg, mpv, Qt u. a.)."
